<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio – Ilyass BEN EL MEKKI | BTS SIO SISR</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:    #050d1a;
  --navy2:   #0a1628;
  --navy3:   #0f2040;
  --blue:    #1e6fff;
  --blue2:   #3d8bff;
  --cyan:    #00d4ff;
  --gold:    #f0a500;
  --white:   #f0f4ff;
  --grey:    #8898aa;
  --card:    #0d1e38;
  --border:  rgba(30,111,255,0.25);
  --glow:    0 0 24px rgba(0,212,255,0.18);
  --radius:  12px;
  --font-h:  'Exo 2', sans-serif;
  --font-b:  'Inter', sans-serif;
  --font-c:  'JetBrains Mono', monospace;
}
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-b);
  background: var(--navy);
  color: var(--white);
  overflow-x: hidden;
}

/* ── SCROLLBAR ────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--navy2); }
::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 3px; }

/* ── NAV ──────────────────────────────────────────────────────────────── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 999;
  background: rgba(5,13,26,0.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2.5rem;
  height: 64px;
}
.nav-logo {
  font-family: var(--font-h);
  font-weight: 800; font-size: 1.1rem;
  color: var(--white);
  letter-spacing: 0.04em;
}
